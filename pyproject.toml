[project]
name = "llm-service"
version = "0.1.0"
description = "FastAPI-сервис для LLM с функциями наблюдаемости (Observability)"
requires-python = ">=3.12"
dependencies = [
    # Основные зависимости
    "fastapi[standard] >=0.110",
    "pydantic >=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard] >=0.29",
    "openai >=1.40",
    "redis >=5.0",
    "tenacity >=8.2",
    # Наблюдаемость
    "arize-phoenix >=4.0",
    "openinference-instrumentation-openai >=0.1",
    "structlog >=24.0",
    "pyyaml>=6.0.3",
    # Chat module (Блок 4.1)
    "aiofiles >=23.2",
    "tiktoken >=0.7",
    "sqlalchemy >=2.0",
    "asyncpg >=0.29",
    "alembic >=1.13",
    # Telegram-бот (Блок 4.2)
    "aiogram>=3.31.0",
    "httpx>=0.28.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "aiohttp-socks>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "pytest-cov>=4.0",
    "aiosqlite>=0.19",
]

[tool.setuptools.packages.find]
include = ["app*", "bot*"]
exclude = ["eval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]